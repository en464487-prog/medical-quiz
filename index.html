<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진료과 약어 암기 퀴즈</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;font-family:system-ui,-apple-system,sans-serif;color:#172033}main{max-width:560px;margin:7vh auto;padding:25px;background:white;border-radius:22px;box-shadow:0 12px 36px #13203c14}h1{font-size:26px}p{line-height:1.6}.muted{color:#657188}label{display:block;margin:20px 0 8px;font-weight:650}select,input{width:100%;padding:14px;border:1px solid #ccd4e3;border-radius:12px;font-size:16px}button{cursor:pointer;font:inherit;border:1px solid #d1d9e6;background:#fff;border-radius:12px;padding:13px 16px}button.primary{background:#3457df;color:white;border:0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none!important}.code{font-size:65px;font-weight:800;text-align:center;margin:25px 0;color:#3457df}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice.correct{background:#dcfce7;border-color:#16a34a}.choice.wrong{background:#fee2e2;border-color:#dc2626}.bar{height:9px;background:#e6ebf5;border-radius:9px;overflow:hidden}.fill{height:100%;background:#3457df;width:0}.feedback{margin-top:15px;font-weight:700}small{color:#64748b}</style></head><body><main><section id="setup"><h1>🩺 진료과 약어 퀴즈</h1><p class="muted">로그인 없이 바로 풀 수 있어요. 29개 약어를 랜덤으로 연습해 보세요!</p><label for="mode">문제 방식</label><select id="mode"><option value="choice">4지선다 객관식</option><option value="typing">직접 타자 입력</option><option value="mixed">객관식 + 타자 혼합</option></select><label for="count">문제 수</label><select id="count"><option value="all">전체 29문제</option><option value="10">랜덤 10문제</option><option value="20">랜덤 20문제</option></select><div class="actions"><button class="primary" onclick="start(false)">시험 시작</button></div><p><small>일부 명칭은 일반적인 진료과 표기로 정리했어요. 기관별 약어는 다를 수 있어요.</small></p></section><section id="quiz" class="hidden"><div style="display:flex;justify-content:space-between"><span id="progress"></span><span id="score"></span></div><div class="bar"><div id="fill" class="fill"></div></div><p class="muted">다음 약어가 뜻하는 진료과는?</p><div id="code" class="code"></div><div id="choices"></div><div id="typing" class="hidden"><input id="answer" placeholder="정답을 입력하세요" autocomplete="off" onkeydown="if(event.key==='Enter')submitTyping()"><div class="actions"><button class="primary" onclick="submitTyping()">정답 확인</button></div></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary hidden" onclick="next()">다음 문제</button></div></section><section id="result" class="hidden"><h1>🎉 시험 완료!</h1><h2 id="resultScore"></h2><p id="resultText"></p><div id="mistakes"></div><div class="actions"><button class="primary" onclick="start(false)">다시 풀기</button><button id="retry" onclick="start(true)">오답만 다시 풀기</button><button onclick="home()">처음으로</button></div></section></main><script>const data=[["BE","유방내분비외과"],["CS","흉부외과","심장혈관흉부외과"],["DE","피부과"],["DN","치과"],["EN","이비인후과"],["EY","안과"],["FM","가정의학과"],["GS","외과","일반외과"],["MC","순환기내과","심장내과"],["MD","호흡기내과"],["MI","감염내과"],["MM","내분비내과"],["MN","신장내과"],["MO","혈액종양내과"],["UR","비뇨의학과","비뇨기과"],["NP","정신건강의학과","정신과"],["NS","신경외과"],["NU","신경과"],["OG","산부인과"],["OS","정형외과"],["PP","소아청소년과","소아과"],["PM","마취통증의학과"],["PS","성형외과"],["RM","재활의학과"],["RT","방사선종양학과"],["EM","응급의학과"],["NM","핵의학과"],["SC","외과계중환자실"],["CT","임상약리학과"]];let queue=[],i=0,correct=0,wrong=[],locked=false,currentMode='choice';const $=x=>document.getElementById(x),shuffle=a=>{let b=[...a];for(let j=b.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[b[j],b[k]]=[b[k],b[j]]}return b};function show(id){for(const s of ['setup','quiz','result'])$(s).classList.toggle('hidden',s!==id)}function start(onlyWrong){let source=onlyWrong?wrong.map(x=>x.item):data;queue=shuffle(source);if(!onlyWrong&&$('count').value!=='all')queue=queue.slice(0,+$('count').value);i=0;correct=0;wrong=[];show('quiz');render()}function render(){locked=false;let item=queue[i];$('progress').textContent=(i+1)+' / '+queue.length;$('score').textContent='정답 '+correct+'개';$('fill').style.width=(i/queue.length*100)+'%';$('code').textContent=item[0];$('feedback').textContent='';$('next').classList.add('hidden');$('choices').replaceChildren();$('typing').classList.add('hidden');currentMode=$('mode').value;if(currentMode==='mixed')currentMode=Math.random()<.5?'choice':'typing';if(currentMode==='typing'){$('typing').classList.remove('hidden');$('answer').value='';$('answer').disabled=false;return}let distract=shuffle(data.filter(x=>x[0]!==item[0]&&x[1]!==item[1])).slice(0,3).map(x=>x[1]);shuffle([item[1],...distract]).forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>check(v,b);$('choices').append(b)})}function normalize(s){return s.replace(/[\s()·.\-]/g,'').trim()}function submitTyping(){if(!locked)check($('answer').value.trim())}function check(value,button){if(locked)return;const item=queue[i],ok=item.slice(1).some(x=>normalize(x)===normalize(value));locked=true;if(ok){correct++;$('feedback').textContent='✅ 정답! '+item[1];$('feedback').style.color='#166534'}else{wrong.push({item,answer:value||'(미입력)'});$('feedback').textContent='❌ 오답! 정답: '+item[1];$('feedback').style.color='#b91c1c'}if(currentMode==='choice'){[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===item[1])b.classList.add('correct');else if(b===button)b.classList.add('wrong')})}else $('answer').disabled=true;$('score').textContent='정답 '+correct+'개';$('next').textContent=i===queue.length-1?'결과 보기 →':'다음 문제 →';$('next').classList.remove('hidden')}function next(){i++;if(i>=queue.length){finish();return}render()}function finish(){show('result');$('resultScore').textContent=correct+' / '+queue.length+'문제 정답 ('+Math.round(correct/queue.length*100)+'점)';$('resultText').textContent=wrong.length?'틀린 문제 '+wrong.length+'개를 다시 연습할 수 있어요.':'전부 맞혔어요!';$('mistakes').replaceChildren();if(wrong.length){let h=document.createElement('h3');h.textContent='오답 노트';$('mistakes').append(h);wrong.forEach(x=>{let p=document.createElement('p');p.textContent=x.item[0]+' — '+x.item[1]+' (입력: '+x.answer+')';$('mistakes').append(p)})}$('retry').style.display=wrong.length?'':'none'}function home(){show('setup')}</script></body></html>
